services:
  postgres:
    image: postgres:16
    container_name: project3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: project3db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - project3_data:/var/lib/postgresql/data
volumes:
  project3_data:
